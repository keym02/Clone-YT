<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f2;--bg3:#e5e5e5;--tx:#0f0f0f;--tx2:#606060;--line:#e5e5e5;--chip:#0000000d;--chipH:#0000001a;--chipA:#0f0f0f;--chipAT:#fff;--hov:#0000000d;--sel:#0000001a;--h:56px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--line:#303030;--chip:#ffffff1a;--chipH:#ffffff33;--chipA:#f1f1f1;--chipAT:#0f0f0f;--hov:#ffffff1a;--sel:#ffffff33}}
:root[data-theme="dark"]{--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--line:#303030;--chip:#ffffff1a;--chipH:#ffffff33;--chipA:#f1f1f1;--chipAT:#0f0f0f;--hov:#ffffff1a;--sel:#ffffff33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Roboto,Arial,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{fill:currentColor;display:block}
:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--hov)}
.ib svg{width:24px;height:24px}

/* header */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--h);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50}
.hl{display:flex;align-items:center;gap:16px;min-width:0}
.logo{display:flex;align-items:center;gap:3px;font-weight:700;font-size:20px;letter-spacing:-1.2px;position:relative}
.logo svg{width:30px;height:21px;color:#f00}
.logo sup{position:absolute;top:-2px;right:-20px;font-size:10px;font-weight:400;letter-spacing:0;color:var(--tx2)}
.hc{flex:0 1 728px;display:flex;align-items:center;gap:12px;margin-left:40px;min-width:0}
.sf{display:flex;flex:1;min-width:0}
.sf input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;background:var(--bg);color:var(--tx);font-size:16px;box-shadow:inset 0 1px 2px #0000000d}
.sf input:focus{outline:0;border-color:#1c62b9}
.sf button{width:64px;height:40px;border:1px solid var(--line);background:var(--bg2);border-radius:0 40px 40px 0;display:grid;place-items:center}
.sf button:hover{background:var(--bg3)}
.mic{background:var(--bg2)}
.hr{display:flex;align-items:center;gap:8px}
.create{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 12px;border-radius:18px;background:var(--bg2);font-weight:500;margin-right:4px}
.create:hover{background:var(--bg3)}
.create svg{width:24px;height:24px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8e2de2,#f5576c);display:grid;place-items:center;color:#fff;font-weight:500;margin-left:8px}
.msb{display:none}

/* sidebar */
aside{position:fixed;top:calc(var(--h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px;z-index:40;scrollbar-width:thin}
aside::-webkit-scrollbar{width:8px}aside::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}aside:hover::-webkit-scrollbar-thumb{background:var(--bg3)}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border:0}
.sec h3{font-size:16px;font-weight:500;padding:6px 12px 8px;display:flex;align-items:center;gap:8px}
.it{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:left;white-space:nowrap}
.it:hover{background:var(--hov)}
.it.on{background:var(--sel);font-weight:500}
.it svg{width:24px;height:24px;flex:none}
.it .ch{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:500}
.it span{overflow:hidden;text-overflow:ellipsis}
.foot{padding:16px 12px;color:var(--tx2);font-size:12px;font-weight:500;line-height:1.7}
.foot p{margin-top:12px;font-weight:400;color:var(--tx2)}
.mini{display:none}
.scrim{display:none;position:fixed;inset:0;background:#00000099;z-index:35}

/* main */
main{margin-left:240px;padding-top:calc(var(--h) + env(safe-area-inset-top,0px))}
body.collapsed main{margin-left:72px}
body.collapsed aside{display:none}
body.collapsed .mini{display:block}
.mini{position:fixed;top:calc(var(--h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:72px;padding:4px;background:var(--bg);z-index:40}
.mi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;font-size:10px;width:100%}
.mi:hover{background:var(--hov)}
.mi svg{width:24px;height:24px}
.chips{position:sticky;top:calc(var(--h) + env(safe-area-inset-top,0px));z-index:30;background:var(--bg);display:flex;gap:12px;padding:12px 24px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--chip);font-weight:500;white-space:nowrap;flex:none}
.chip:hover{background:var(--chipH)}
.chip.on{background:var(--chipA);color:var(--chipAT)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:40px 16px;padding:8px 24px 48px}
.v{min-width:0;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:grid;place-items:center;transition:border-radius .2s}
.v:hover .th{border-radius:0}
.th b{font-size:clamp(18px,2.6vw,28px);text-align:center;padding:0 14px;color:#fff;text-shadow:0 2px 8px #0006;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.dur{position:absolute;right:8px;bottom:8px;background:#000000cc;color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.info{display:flex;gap:12px;margin-top:12px}
.ca{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:500}
.t{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--tx2);font-size:14px;line-height:20px;margin-top:4px}
.m .cn:hover{color:var(--tx)}
.dots{margin-left:auto;opacity:0;width:24px;height:24px;flex:none}
.v:hover .dots{opacity:1}
.empty{grid-column:1/-1;text-align:center;color:var(--tx2);padding:80px 0;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1312px){body:not(.mobile-open) aside{display:none}body:not(.mobile-open) .mini{display:block}main,body.collapsed main{margin-left:72px}body.mobile-open aside{box-shadow:0 0 20px #0006}body.mobile-open .scrim{display:block}body.mobile-open .mini{display:none}}
@media (max-width:792px){.hc{margin-left:8px}.create span{display:none}.create{padding:0 8px;border-radius:50%;width:36px;justify-content:center}.mini{display:none!important}main,body.collapsed main{margin-left:0}.grid{grid-template-columns:1fr;gap:24px;padding:0 0 32px}.th,.v:hover .th{border-radius:0}.info{padding:0 12px}.chips{padding:12px}.mic,.bell{display:none}.logo sup{display:none}}
@media (max-width:600px){.sf button{width:48px}header{padding:0 8px}.hl .logo span{display:none}.hl{gap:4px}.hl .logo{margin-left:0}.msb{display:grid}.hc{display:none}.hc.open{display:flex;position:absolute;left:0;right:0;top:0;height:var(--h);background:var(--bg);padding:0 8px;margin:0;z-index:2}.hide-s{display:none}.av{margin-left:0}}
@media (min-width:793px) and (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1101px){.grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

["Weekly dev news, no hype","Computers",1,"13:21","310K views","1 day ago"],
["Live: sunrise from Taal viewpoint","Live",7,"LIVE","6.2K watching","Streaming now"],
["Ten kitchen mistakes beginners make","Cooking",2,"11:40","960K views","3 weeks ago"]
];
let cat="All",term="";
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const g=$("#grid");
  const list=data.filter(v=>(cat==="All"||v[1]===cat||(cat==="Recently uploaded"&&/hour|day/.test(v[5]))||(cat==="New to you"&&v[0].length%2)||(cat==="Watched"&&v[0].length%3===0))&&v[0].toLowerCase().includes(term));
  if(!list.length){g.innerHTML='<div class="empty">No results found. Try different keywords.</div>';return}
  g.innerHTML=list.map((v,i)=>{const c=chans[v[2]];const gr=grads[(data.indexOf(v)*5)%grads.length];
    return `<article class="v" tabindex="0" data-t="${esc(v[0])}"><div class="th" style="background:linear-gradient(135deg,${gr})"><b>${esc(v[0])}</b><span class="dur" ${v[3]==="LIVE"?'style="background:#cc0000"':''}>${v[3]==="LIVE"?"● LIVE":v[3]}</span></div>
    <div class="info"><div class="ca" style="background:${c[1]}">${c[0][0]}</div><div style="min-width:0"><h3 class="t">${esc(v[0])}</h3><div class="m"><span class="cn">${c[0]}</span><br>${v[4]} • ${v[5]}</div></div>
    <button class="dots ib" aria-label="Action menu" data-toast="More actions need an account"><svg viewBox="0 0 24 24"><path d="M12 16.500c.83 0 1.500.67 1.500 1.500s-.67 1.500-1.500 1.500-1.500-.67-1.500-1.500.67-1.500 1.500-1.500zM10.500 12c0 .83.67 1.500 1.500 1.500s1.500-.67 1.500-1.500-.67-1.500-1.500-1.500-1.500.67-1.500 1.500zm0-6c0 .83.67 1.500 1.500 1.500S13.500 6.830 13.500 6 12.830 4.500 12 4.500 10.500 5.170 10.500 6z"/></svg></button></div></article>`}).join("");
}
function chips(){$("#chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" role="tab" aria-selected="${c===cat}">${c}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.textContent;chips();render()});
$("#sf").addEventListener("submit",e=>{e.preventDefault();term=$("#q").value.trim().toLowerCase();render()});
$("#q").addEventListener("input",e=>{if(!e.target.value){term="";render()}});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-toast]");if(t){e.stopPropagation();toast(t.dataset.toast);return}
  const v=e.target.closest(".v");if(v)toast("Playing “"+v.dataset.t+"” (demo)");
  const mi=e.target.closest(".mi");if(mi)toast(mi.textContent.trim()+" (demo)");
  const it=e.target.closest(".it");if(it){document.querySelectorAll(".it").forEach(x=>x.classList.remove("on"));it.classList.add("on");document.body.classList.remove("mobile-open")}});
document.addEventListener("keydown",e=>{if((e.key==="Enter")&&e.target.classList.contains("v"))e.target.click();if(e.key==="Escape")document.body.classList.remove("mobile-open")});
$("#menu").addEventListener("click",()=>{if(innerWidth<=1312){document.body.classList.toggle("mobile-open")}else document.body.classList.toggle("collapsed")});
$("#scrim").addEventListener("click",()=>document.body.classList.remove("mobile-open"));
$("#sbtn").addEventListener("click",()=>{$("#hc").classList.add("open");$("#back").style.display="grid";$("#q").focus()});
$("#back").addEventListener("click",()=>{$("#hc").classList.remove("open");$("#back").style.display="none"});
addEventListener("resize",()=>{if(innerWidth>600){$("#hc").classList.remove("open");$("#back").style.display="none"}});
$("#theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"});
chips();render();
</script>
</body>
</html>
