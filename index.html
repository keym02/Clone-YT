<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f2;--bg3:#e5e5e5;--tx:#0f0f0f;--tx2:#606060;--line:#e5e5e5;--chip:#0000000d;--chipH:#0000001a;--chipA:#0f0f0f;--chipAT:#fff;--hov:#0000000d;--sel:#0000001a;--h:56px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--line:#303030;--chip:#ffffff1a;--chipH:#ffffff33;--chipA:#f1f1f1;--chipAT:#0f0f0f;--hov:#ffffff1a;--sel:#ffffff33}}
:root[data-theme="dark"]{--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--line:#303030;--chip:#ffffff1a;--chipH:#ffffff33;--chipA:#f1f1f1;--chipAT:#0f0f0f;--hov:#ffffff1a;--sel:#ffffff33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Roboto,Arial,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{fill:currentColor;display:block}
:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--hov)}
.ib svg{width:24px;height:24px}
/* header */
header{position:fixed;top:0;left:0;right:0;height:var(--h);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50}
.hl{display:flex;align-items:center;gap:16px;min-width:0}
.logo{display:flex;align-items:center;gap:3px;font-weight:700;font-size:20px;letter-spacing:-1.2px;position:relative}
.logo svg{width:30px;height:21px;color:#f00}
.logo sup{position:absolute;top:-2px;right:-20px;font-size:10px;font-weight:400;letter-spacing:0;color:var(--tx2)}
.hc{flex:0 1 728px;display:flex;align-items:center;gap:12px;margin-left:40px;min-width:0}
.sf{display:flex;flex:1;min-width:0}
.sf input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;background:var(--bg);color:var(--tx);font-size:16px}
.sf input:focus{outline:0;border-color:#1c62b9}
.sf button{width:64px;height:40px;border:1px solid var(--line);background:var(--bg2);border-radius:0 40px 40px 0;display:grid;place-items:center}
.sf button:hover{background:var(--bg3)}
.mic{background:var(--bg2)}.mic.rec{background:#f00;color:#fff}
.hr{display:flex;align-items:center;gap:8px;position:relative}
.create{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 12px;border-radius:18px;background:var(--bg2);font-weight:500;margin-right:4px}
.create:hover{background:var(--bg3)}.create svg{width:24px;height:24px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8e2de2,#f5576c);display:grid;place-items:center;color:#fff;font-weight:500;margin-left:8px}
.bell{position:relative}.bell i{position:absolute;top:2px;right:0;background:#c00;color:#fff;font-size:10px;font-style:normal;border-radius:8px;padding:1px 5px}
.msb{display:none}
/* popovers */
.pop{position:fixed;background:var(--bg2);color:var(--tx);border-radius:12px;box-shadow:0 4px 32px #0004;padding:8px 0;z-index:70;min-width:220px;max-width:92vw;display:none}
.pop.show{display:block}
.pop h4{padding:8px 16px;font-size:16px;font-weight:500;border-bottom:1px solid var(--line);margin-bottom:6px}
.pi{display:flex;align-items:center;gap:16px;width:100%;padding:0 16px;height:40px;text-align:left}
.pi:hover{background:var(--hov)}.pi svg{width:24px;height:24px}
.pn{display:flex;gap:12px;padding:10px 16px;width:100%;text-align:left;align-items:center}
.pn:hover{background:var(--hov)}
.pn .tn{width:86px;aspect-ratio:16/9;border-radius:6px;flex:none}
/* sidebar */
aside{position:fixed;top:var(--h);left:0;bottom:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px;z-index:40;scrollbar-width:thin}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border:0}
.sec h3{font-size:16px;font-weight:500;padding:6px 12px 8px}
.it{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:left;white-space:nowrap}
.it:hover{background:var(--hov)}.it.on{background:var(--sel);font-weight:500}
.it svg{width:24px;height:24px;flex:none}
.it .ch{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:500}
.it span{overflow:hidden;text-overflow:ellipsis}
.foot{padding:16px 12px;color:var(--tx2);font-size:12px;font-weight:500;line-height:1.7}
.foot p{margin-top:12px;font-weight:400}
.mini{display:none;position:fixed;top:var(--h);left:0;bottom:0;width:72px;padding:4px;background:var(--bg);z-index:40}
.mi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;font-size:10px;width:100%}
.mi:hover{background:var(--hov)}.mi svg{width:24px;height:24px}
.scrim{display:none;position:fixed;inset:0;background:#00000099;z-index:35}
/* main */
main{margin-left:240px;padding-top:var(--h)}
body.collapsed main{margin-left:72px}body.collapsed aside{display:none}body.collapsed .mini{display:block}
.chips{position:sticky;top:var(--h);z-index:30;background:var(--bg);display:flex;gap:12px;padding:12px 24px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--chip);font-weight:500;white-space:nowrap;flex:none}
.chip:hover{background:var(--chipH)}.chip.on{background:var(--chipA);color:var(--chipAT)}
.vt{font-size:20px;font-weight:700;padding:20px 24px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:40px 16px;padding:12px 24px 48px}
.grid.shorts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.shorts .th{aspect-ratio:9/16}
.v{min-width:0;cursor:pointer;position:relative}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:grid;place-items:center;transition:border-radius .2s}
.v:hover .th{border-radius:0}
.th b{font-size:clamp(18px,2.6vw,28px);text-align:center;padding:0 14px;color:#fff;text-shadow:0 2px 8px #0006;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.dur{position:absolute;right:8px;bottom:8px;background:#000000cc;color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.info{display:flex;gap:12px;margin-top:12px}
.ca{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:500;cursor:pointer}
.t{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--tx2);font-size:14px;line-height:20px;margin-top:4px}
.cn{cursor:pointer}.cn:hover{color:var(--tx)}
.dots{margin-left:auto;opacity:0;width:24px;height:24px;flex:none}
.v:hover .dots,.dots:focus-visible{opacity:1}
.empty{grid-column:1/-1;text-align:center;color:var(--tx2);padding:80px 0;font-size:16px}
/* watch */
.watch{display:none;padding:24px;gap:24px;grid-template-columns:minmax(0,1fr) 402px;max-width:1754px;margin:0 auto}
.watch.show{display:grid}
.pl{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;user-select:none}
.pl video,.pl canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
.pl video{object-fit:contain}
.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.th img,.tn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pn .tn{position:relative;overflow:hidden}
.pl:fullscreen{border-radius:0;aspect-ratio:auto}
.ctl{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 8px;background:linear-gradient(transparent,#000b);color:#fff;opacity:0;transition:opacity .2s}
.pl:hover .ctl,.pl.paused .ctl,.ctl:focus-within{opacity:1}
.ctl input[type=range]{width:100%;accent-color:#f00;cursor:pointer;height:14px}
.cr{display:flex;align-items:center;gap:4px}
.cr .ib{width:36px;height:36px}.cr .ib:hover{background:#ffffff33}
.cr input[type=range]{width:70px}
.tm{font-size:13px;margin-left:6px;white-space:nowrap}
.sp{flex:1}
.rate{font-size:13px;font-weight:500;padding:0 8px;height:30px;border-radius:15px}.rate:hover{background:#ffffff33}
.live{background:#c00;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:500;margin-left:8px}
.bigp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.bigp span{width:68px;height:48px;border-radius:12px;background:#000a;display:none;place-items:center;color:#fff}
.pl.paused .bigp span{display:grid}
.bigp svg{width:34px;height:34px}
.wt{font-size:20px;font-weight:700;line-height:28px;margin-top:12px}
.ar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.ch2{display:flex;align-items:center;gap:12px;margin-right:12px}
.ch2 .nm{font-weight:500;font-size:16px}.ch2 .sb{font-size:12px;color:var(--tx2)}
.sub{height:36px;padding:0 16px;border-radius:18px;background:var(--tx);color:var(--bg);font-weight:500}
.sub.on{background:var(--bg2);color:var(--tx)}
.pill{display:flex;background:var(--bg2);border-radius:18px;overflow:hidden}
.pb{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;background:var(--bg2);border-radius:18px;font-weight:500;white-space:nowrap}
.pill .pb{border-radius:0;padding:0 14px}
.pb:hover{background:var(--bg3)}.pb svg{width:22px;height:22px}
.pb.on{color:#3ea6ff}
.pb.dn svg{transform:rotate(180deg)}
.pill .pb+.pb{border-left:1px solid var(--line)}
.desc{background:var(--bg2);border-radius:12px;padding:12px;margin-top:16px;font-size:14px;line-height:20px}
.desc b{font-weight:500}
.desc p{margin-top:8px;white-space:pre-wrap}
.cm h3{font-size:20px;margin:24px 0 16px}
.cin{display:flex;gap:16px;margin-bottom:24px}
.cin input{flex:1;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);font-size:14px;padding:6px 0}
.cin input:focus{outline:0;border-color:var(--tx)}
.cin button{padding:0 16px;height:36px;border-radius:18px;background:#065fd4;color:#fff;font-weight:500}
.cm .c{display:flex;gap:16px;margin-bottom:20px}
.cm .c .ca{width:40px;height:40px}
.cm .c small{color:var(--tx2);margin-left:6px}
.up{display:flex;flex-direction:column;gap:8px}
.upc{display:flex;gap:8px;cursor:pointer;position:relative}
.upc .th{width:168px;flex:none;border-radius:8px}.upc .th b{font-size:13px;padding:0 8px}
.upc .t{font-size:14px;line-height:20px}.upc .m{font-size:12px;line-height:18px;margin-top:2px}
.upc .dots{position:absolute;right:0;top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1312px){aside{display:none}body.mobile-open aside{display:block;box-shadow:0 0 20px #0006}body.mobile-open .scrim{display:block}.mini{display:block}body.mobile-open .mini{display:none}main,body.collapsed main{margin-left:72px}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.grid.shorts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.watch{grid-template-columns:1fr}}
@media (max-width:792px){.hc{margin-left:8px}.create span{display:none}.create{padding:0 8px;border-radius:50%;width:36px;justify-content:center}.mini{display:none!important}main,body.collapsed main{margin-left:0}.grid{grid-template-columns:1fr;gap:24px;padding:12px 0 32px}.grid.shorts{grid-template-columns:repeat(2,1fr);padding:12px}.th,.v:hover .th{border-radius:0}.info{padding:0 12px}.chips{padding:12px}.mic,.bell{display:none}.logo sup{display:none}.vt{padding:16px 12px 0}.watch{padding:0 0 24px}.watch>div{padding:0}.pl{border-radius:0}.wt,.ar,.desc,.cm{margin-left:12px;margin-right:12px}.up{padding:0 12px}.logo span{font-size:18px}}
@media (max-width:600px){.sf button{width:48px}header{padding:0 8px}.hl .logo span{display:none}.hl{gap:4px}.msb{display:grid}.hc{display:none}.hc.open{display:flex;position:absolute;left:0;right:0;top:0;height:var(--h);background:var(--bg);padding:0 8px;margin:0;z-index:2}.hide-s{display:none}.av{margin-left:0}.cr input[type=range]{display:none}.upc .th{width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>

<div class="scrim" id="scrim"></div>

    <button class="it" data-act="view" data-v="shorts"><svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33-1.2-.5L18 9.06a3.74 3.74 0 0 0-1.5-6.88 3.6 3.6 0 0 0-1.72.12L6 7.26a3.73 3.73 0 0 0-.9 5.98l.96.88-1.6.84a3.74 3.74 0 0 0 .93 6.76c.64.15 1.32.1 1.92-.16l8.62-5.27a3.74 3.74 0 0 0 1.83-4.97z"/></svg><span>Shorts</span></button>
    <button class="it" data-act="view" data-v="subs"><svg viewBox="0 0 24 24"><path d="M10 18v-6l5 3-5 3zm7-15H7v1h10V3zm3 3H4v1h16V6zm2 3H2v12h20V9zM3 10h18v10H3V10z"/></svg><span>Subscriptions</span></button>
  </div>
  <div class="sec">
    <h3>You</h3>
    <button class="it" data-act="view" data-v="history"><svg viewBox="0 0 24 24"><path d="M14.97 16.95L10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 3c-4.96 0-9 4.04-9 9s4.04 9 9 9 9-4.04 9-9-4.04-9-9-9m0-1c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/></svg><span>History</span></button>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const I=(n,x="")=>`<svg viewBox="0 0 24 24" ${x}><path d="${ic[n]}"/></svg>`;
const cats=["All","Music","Animation","Viral","Watched","New to you"];
const grads=["#ff5f6d,#ffc371","#4776e6,#8e54e9","#11998e,#38ef7d","#f7971e,#ffd200","#ee0979,#ff6a00","#00c6ff,#0072ff","#654ea3,#eaafc8","#134e5e,#71b280","#cb2d3e,#ef473a","#232526,#616161","#614385,#516395","#fc4a1a,#f7b733"];
const chans=[["Rick Astley","#e53935"],["officialpsy","#1e88e5"],["Luis Fonsi","#43a047"],["Queen Official","#8e24aa"],["AdeleVEVO","#fb8c00"],["Ed Sheeran","#00897b"],["Mark Ronson","#d81b60"],["Wiz Khalifa","#3949ab"],["Alan Walker","#546e7a"],["OneRepublic","#6d4c41"],["Katy Perry","#c2185b"],["Taylor Swift","#7b1fa2"],["Blender","#ef6c00"],["jawed","#2e7d32"]];
const subCount={"Rick Astley":"4.3M","officialpsy":"18M","Luis Fonsi":"29M","Queen Official":"19M","AdeleVEVO":"65M","Ed Sheeran":"58M","Mark Ronson":"2.1M","Wiz Khalifa":"36M","Alan Walker":"46M","OneRepublic":"15M","Katy Perry":"46M","Taylor Swift":"60M","Blender":"1.9M","jawed":"1.1M"};
const colOf={};chans.forEach(c=>colOf[c[0]]=c[1]);
/* [title, category, channel index, real YouTube video ID, approx views, age] */
const raw=[
["Rick Astley - Never Gonna Give You Up (Official Video)","Music",0,"dQw4w9WgXcQ","1.7B views","17 years ago"],
["PSY - GANGNAM STYLE(강남스타일) M/V","Music",1,"9bZkp7q19f0","5.6B views","14 years ago"],
["Luis Fonsi - Despacito ft. Daddy Yankee","Music",2,"kJQP7kiw5Fk","8.7B views","9 years ago"],
["Queen – Bohemian Rhapsody (Official Video Remastered)","Music",3,"fJ9rUzIMcZQ","1.7B views","18 years ago"],
["Adele - Hello (Official Music Video)","Music",4,"YQHsXMglC9A","3.4B views","11 years ago"],
["Ed Sheeran - Shape of You (Official Music Video)","Music",5,"JGwWNGJdvx8","6.5B views","9 years ago"],
["Mark Ronson - Uptown Funk (Official Video) ft. Bruno Mars","Music",6,"OPf0YbXqDm0","5.2B views","12 years ago"],
["Wiz Khalifa - See You Again ft. Charlie Puth","Music",7,"RgKAFK5djSk","6.3B views","11 years ago"],
["Alan Walker - Faded","Music",8,"60ItHLz5WEA","3.8B views","10 years ago"],
["OneRepublic - Counting Stars","Music",9,"hT_nvWreIhg","4.5B views","13 years ago"],
["Katy Perry - Roar (Official)","Music",10,"CevxZvSJLk8","3.9B views","13 years ago"],
["Taylor Swift - Blank Space","Music",11,"e-ORhEE9VVg","3.7B views","11 years ago"],
["Big Buck Bunny 60fps 4K - Official Blender Foundation Short Film","Animation",12,"aqz-KE-bpKQ","30M views","12 years ago"],
["Sintel - Third Open Movie by Blender Foundation","Animation",12,"eRsGyueVLvQ","40M views","16 years ago"],
["Me at the zoo","Viral",13,"jNQXAC9IVRw","380M views","21 years ago"]];
const TH=v=>`<img src="https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">`;
const num=s=>{const m=s.match(/([\d.]+)([KMB]?)/);return m?parseFloat(m[1])*({K:1e3,M:1e6,B:1e9}[m[2]]||1):0};
const fmt=n=>n>=1e9?(n/1e9).toFixed(1).replace(/\.0$/,"")+"B":n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e3?Math.round(n/1e3)+"K":""+n;
const V=raw.map((r,i)=>({id:i,t:r[0],c:r[1],ch:chans[r[2]][0],col:chans[r[2]][1],yt:r[3],d:"",v:r[4],a:r[5],n:num(r[4]),g:grads[(i*5)%12]}));
const sec=d=>{const p=d.split(":").map(Number);return p.length==3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]};
const clock=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={hist:[],later:[],liked:[],dis:[],hide:[],subs:["Rick Astley","Queen Official","AdeleVEVO","Blender"],cm:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("ytclone2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ytclone2",JSON.stringify(S))}catch(e){}};
const has=(k,id)=>S[k].includes(id);
const flip=(k,id)=>{const i=S[k].indexOf(id);i<0?S[k].push(id):S[k].splice(i,1);save();return i<0};

let view="home",arg=null,cat="All",term="",cur=null,player=null,tt;
const titles={shorts:"Shorts",subs:"Subscriptions",history:"Watch history",later:"Watch later",liked:"Liked videos",trending:"Trending",music:"Music",gaming:"Gaming",news:"News",playlists:"Playlists"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}

function pool(){
  let l=V.filter(x=>!S.hide.includes(x.id));
  if(view==="home")l=l.filter(v=>cat==="All"||v.c===cat||(cat==="Recently uploaded"&&/hour|day/.test(v.a))||(cat==="New to you"&&v.t.length%2)||(cat==="Watched"&&has("hist",v.id)));
  else if(view==="subs")l=l.filter(v=>S.subs.includes(v.ch));
  else if(view==="ch")l=l.filter(v=>v.ch===arg);
  else if(view==="history")l=S.hist.map(i=>V[i]).filter(x=>x&&!S.hide.includes(x.id));
  else if(view==="later")l=S.later.map(i=>V[i]);
  else if(view==="liked")l=S.liked.map(i=>V[i]);
  else if(view==="trending")l=[...l].sort((a,b)=>b.n-a.n);
  else if(["music","gaming","news"].includes(view))l=l.filter(v=>v.c.toLowerCase()===view);
  return l.filter(v=>(v.t+" "+v.ch+" "+v.c).toLowerCase().includes(term));
}
function card(v,short){
  const live=v.d==="LIVE";
  return `<article class="v" tabindex="0" data-act="open" data-id="${v.id}"><div class="th" style="background:linear-gradient(135deg,${v.g})">${TH(v)}</div>
  <div class="info">${short?"":`<div class="ca" style="background:${v.col}" data-act="ch" data-n="${esc(v.ch)}">${v.ch[0]}</div>`}<div style="min-width:0"><h3 class="t">${esc(v.t)}</h3><div class="m"><span class="cn" data-act="ch" data-n="${esc(v.ch)}">${v.ch}</span><br>${v.v} • ${v.a}</div></div>
  <button class="dots ib" aria-label="Action menu" data-act="cmenu" data-id="${v.id}">${I("dots")}</button></div></article>`;
}
function render(){
  stopPlayer();
  $("#watch").classList.remove("show");$("#grid").style.display="";
  const g=$("#grid"),home=view==="home";
  $("#chips").style.display=home?"flex":"none";
  const vt=$("#vt");vt.hidden=home;
  vt.textContent=view==="ch"?arg:(titles[view]||"");
  g.className="grid"+(view==="shorts"?" shorts":"");
  if(view==="playlists"){
    g.innerHTML=[["later","Watch later",S.later],["liked","Liked videos",S.liked]].map(([k,n,a])=>`<article class="v" tabindex="0" data-act="view" data-v="${k}"><div class="th" style="background:linear-gradient(135deg,${a.length?V[a[0]].g:"#444,#222"})"><b>${n}</b><span class="dur">${a.length} videos</span></div><div class="info"><div><h3 class="t">${n}</h3><div class="m">Private playlist</div></div></div></article>`).join("");
  }else{
    const l=pool();
    g.innerHTML=l.length?l.map(v=>card(v,view==="shorts")).join(""):`<div class="empty">${term?"No results found. Try different keywords.":"Nothing here yet. Watch, like or save some videos first."}</div>`;
  }
  $$(".it[data-v],.mi[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $$(".it[data-n]").forEach(b=>b.classList.toggle("on",view==="ch"&&b.dataset.n===arg));
  window.scrollTo(0,0);
}
function go(v,a){view=v;arg=a||null;term="";$("#q").value="";document.body.classList.remove("mobile-open");closePop();render()}
function chips(){$("#chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" role="tab" aria-selected="${c===cat}">${c}</button>`).join("")}
function subList(){$("#subsec").innerHTML="<h3>Subscriptions</h3>"+S.subs.map(n=>`<button class="it${view==="ch"&&arg===n?" on":""}" data-act="ch" data-n="${esc(n)}"><div class="ch" style="background:${colOf[n]}">${n[0]}</div><span>${n}</span></button>`).join("")||"<h3>Subscriptions</h3>"}

/* ---------- watch page ---------- */
function watch(id){
  const v=V[id];cur=id;stopPlayer();closePop();
  S.hist=[id,...S.hist.filter(x=>x!==id)];save();
  $("#chips").style.display="none";$("#vt").hidden=true;$("#grid").style.display="none";
  const w=$("#watch");w.classList.add("show");
  document.body.classList.remove("mobile-open");
  w.innerHTML=`<div><div class="pl paused" id="pl"></div><h1 class="wt">${esc(v.t)}</h1><div class="ar" id="ar"></div>
    <div class="desc"><b>${v.v} &nbsp; ${v.a}</b><p>${esc(v.t)} — ${esc(v.c)}. Thanks for watching! Like, subscribe and leave a comment below.\n\n#${v.c.replace(/\s/g,"")} #${v.ch.replace(/\s/g,"")}</p></div>
    <div class="cm" id="cm"></div></div>
    <div class="up" id="up">${V.filter(x=>x.id!==id&&!S.hide.includes(x.id)).map(x=>`<div class="upc" tabindex="0" data-act="open" data-id="${x.id}"><div class="th" style="background:linear-gradient(135deg,${x.g})">${TH(x)}</div><div style="min-width:0"><h3 class="t">${esc(x.t)}</h3><div class="m">${x.ch}<br>${x.v} • ${x.a}</div></div><button class="dots ib" aria-label="Action menu" data-act="cmenu" data-id="${x.id}">${I("dots")}</button></div>`).join("")}</div>`;
  actions();comments();
  player=mkPlayer($("#pl"),v);
  window.scrollTo(0,0);
}
function actions(){
  const v=V[cur],sub=S.subs.includes(v.ch),lk=has("liked",cur),dl=has("dis",cur);
  const likes=Math.round(v.n/40)+(lk?1:0);
  $("#ar").innerHTML=`<div class="ch2"><div class="ca" style="background:${v.col}" data-act="ch" data-n="${esc(v.ch)}">${v.ch[0]}</div><div><div class="nm cn" data-act="ch" data-n="${esc(v.ch)}">${v.ch}</div><div class="sb">${subCount[v.ch]} subscribers</div></div></div>
  <button class="sub${sub?" on":""}" data-act="sub">${sub?"Subscribed ✓":"Subscribe"}</button>
  <div class="pill"><button class="pb${lk?" on":""}" data-act="like">${I("up")}${fmt(likes)}</button><button class="pb dn${dl?" on":""}" data-act="dislike" aria-label="Dislike">${I("up")}</button></div>
  <button class="pb" data-act="share">${I("share")}Share</button>
  <button class="pb${has("later",cur)?" on":""}" data-act="later">${I("save")}${has("later",cur)?"Saved":"Save"}</button>
  <button class="pb" data-act="dl">${I("dl")}Download</button>`;
}
function comments(){
  const l=S.cm[cur]||(S.cm[cur]=[["Maria S.","Super helpful, thanks!","2 days ago"],["Ben R.","Watched this twice already.","1 day ago"],["Lea T.","Great explanation, subscribed.","5 hours ago"]]);
  $("#cm").innerHTML=`<h3>${l.length} Comments</h3><form class="cin" id="cf"><div class="ca" style="background:#8e2de2">J</div><input id="ci" placeholder="Add a comment..." aria-label="Add a comment" autocomplete="off"><button type="submit">Comment</button></form>`+
  l.map(c=>`<div class="c"><div class="ca" style="background:${grads[c[0].length%12].split(",")[0]}">${c[0][0]}</div><div><b>@${c[0].replace(/\s/g,"").toLowerCase()}</b><small>${c[2]}</small><div style="margin-top:4px">${esc(c[1])}</div></div></div>`).join("");
}

/* ---------- player ---------- */
function stopPlayer(){if(player){player.destroy();player=null}}
function mkPlayer(box,v){
  box.classList.remove("paused");
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.yt}?autoplay=1&rel=0&playsinline=1" title="${esc(v.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  return{destroy(){box.innerHTML=""}};
}

/* ---------- popovers ---------- */
function closePop(){$("#pop").classList.remove("show")}
function openPop(html,x,y,right){
  const p=$("#pop");p.innerHTML=html;p.classList.add("show");p.style.left=p.style.right="auto";
  const w=p.offsetWidth,h=p.offsetHeight;
  let L=right?x-w:x;L=Math.max(8,Math.min(L,innerWidth-w-8));let T=Math.max(8,Math.min(y,innerHeight-h-8));
  p.style.left=L+"px";p.style.top=T+"px";
}
function headerPop(kind,btn){
  const r=btn.getBoundingClientRect();let h="";
  if(kind==="create")h=`<button class="pi" data-act="toast" data-m="Sign in to upload videos">${I("plus")}Upload video</button><button class="pi" data-act="toast" data-m="Sign in to go live">${I("plus")}Go live</button><button class="pi" data-act="toast" data-m="Sign in to create a post">${I("plus")}Create post</button>`;
  if(kind==="bell"){h=`<h4>Notifications</h4>`+[0,7,9].map(i=>`<button class="pn" data-act="open" data-id="${i}"><div class="ca" style="background:${V[i].col}">${V[i].ch[0]}</div><div style="flex:1;font-size:14px">${V[i].ch} uploaded: ${esc(V[i].t)}<div class="m" style="margin:2px 0 0;font-size:12px">${V[i].a}</div></div><div class="tn" style="background:linear-gradient(135deg,${V[i].g})">${TH(V[i])}</div></button>`).join("");$("#nb").style.display="none"}
  if(kind==="acct")h=`<h4>Your account</h4><button class="pi" data-act="view" data-v="history">${I("user")}Watch history</button><button class="pi" data-act="view" data-v="liked">${I("up")}Liked videos</button><button class="pi" data-act="view" data-v="later">${I("save")}Watch later</button><button class="pi" data-act="theme">${I("user")}Switch appearance</button><button class="pi" data-act="clear">${I("x")}Clear watch history</button>`;
  openPop(h,r.right,r.bottom+8,true);
}
function cardMenu(id,btn){
  const r=btn.getBoundingClientRect();
  openPop(`<button class="pi" data-act="later" data-id="${id}">${I("save")}${has("later",id)?"Remove from Watch later":"Save to Watch later"}</button><button class="pi" data-act="share" data-id="${id}">${I("share")}Share</button><button class="pi" data-act="hide" data-id="${id}">${I("x")}Not interested</button>`,r.right,r.bottom+4,true);
}
function share(id){const u=location.href.split("#")[0]+"#v"+id;try{navigator.clipboard.writeText(u).then(()=>toast("Link copied to clipboard"),()=>toast(u))}catch(e){toast(u)}}
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const pop=$("#pop");
  const a=e.target.closest("[data-act]");
  if(!a){if(!e.target.closest("#pop"))closePop();const ch=e.target.closest(".chip");if(ch){cat=ch.textContent;chips();render()}return}
  const act=a.dataset.act,id=a.dataset.id!=null?+a.dataset.id:cur;
  if(act!=="pop"&&act!=="cmenu"&&!a.closest("#pop"))closePop();
  if(a.closest("#pop")&&act!=="open")closePop();
  if(a.tagName==="A")e.preventDefault();
  switch(act){
    case"open":e.stopPropagation();watch(+a.dataset.id);break;
    case"view":go(a.dataset.v);break;
    case"ch":e.stopPropagation();go("ch",a.dataset.n);break;
    case"pop":e.stopPropagation();if(pop.classList.contains("show")&&pop.dataset.o===a.dataset.p){closePop();pop.dataset.o=""}else{headerPop(a.dataset.p,a);pop.dataset.o=a.dataset.p}break;
    case"cmenu":e.stopPropagation();pop.dataset.o="";cardMenu(id,a);break;
    case"sub":{const n=V[cur].ch,i=S.subs.indexOf(n);i<0?S.subs.push(n):S.subs.splice(i,1);save();actions();subList();toast(i<0?"Subscribed to "+n:"Unsubscribed from "+n);break}
    case"like":{const on=flip("liked",cur);if(on&&has("dis",cur))flip("dis",cur);actions();toast(on?"Added to Liked videos":"Removed from Liked videos");break}
    case"dislike":{const on=flip("dis",cur);if(on&&has("liked",cur))flip("liked",cur);actions();toast(on?"Thanks for the feedback":"Dislike removed");break}
    case"later":{const on=flip("later",id);if(cur!==null&&$("#watch").classList.contains("show"))actions();toast(on?"Saved to Watch later":"Removed from Watch later");if(view==="later")render();break}
    case"share":share(id);break;
    case"dl":toast("Downloads are available in the YouTube app");break;
    case"hide":S.hide.push(id);save();toast("Okay, we'll show fewer videos like this");if($("#watch").classList.contains("show"))watch(cur);else render();break;
    case"toast":toast(a.dataset.m);break;
    case"theme":toggleTheme();break;
    case"clear":S.hist=[];save();toast("Watch history cleared");if(view==="history")render();break;
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="cf"){e.preventDefault();const i=$("#ci"),t=i.value.trim();if(!t)return;S.cm[cur].unshift(["You",t,"Just now"]);save();comments();toast("Comment added")}
});
$("#sf").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(!$("#watch").classList.contains("show")&&view!=="home"&&view!=="ch"&&!titles[view]){}
  if($("#watch").classList.contains("show")){view="home";}term=q.toLowerCase();render();if(innerWidth<=600){$("#hc").classList.remove("open");$("#back").style.display="none"}});
$("#q").addEventListener("input",e=>{if(!e.target.value&&term){term="";if(!$("#watch").classList.contains("show"))render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){document.body.classList.remove("mobile-open");closePop()}
  if(e.key==="Enter"&&e.target.matches("[data-act=open],.v")&&!e.target.matches("input,button")){e.target.click()}
  if(!player||!player.toggle||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.tagName==="BUTTON"&&e.key===" ")return;
  const k=e.key.toLowerCase();
  if(k===" "||k==="k"){e.preventDefault();player.toggle()}
  else if(k==="f")player.fs();else if(k==="m")player.mute();
  else if(k==="arrowright"||k==="l")player.seek(5);else if(k==="arrowleft"||k==="j")player.seek(-5);
});
$("#menu").addEventListener("click",()=>{innerWidth<=1312?document.body.classList.toggle("mobile-open"):document.body.classList.toggle("collapsed")});
$("#scrim").addEventListener("click",()=>document.body.classList.remove("mobile-open"));
$("#sbtn").addEventListener("click",()=>{$("#hc").classList.add("open");$("#back").style.display="grid";$("#q").focus()});
$("#back").addEventListener("click",()=>{$("#hc").classList.remove("open");$("#back").style.display="none"});
addEventListener("resize",()=>{if(innerWidth>600){$("#hc").classList.remove("open");$("#back").style.display="none"}closePop()});
$("#theme").addEventListener("click",toggleTheme);
$("#mic").addEventListener("click",()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice search isn't supported in this browser");return}
  const r=new SR(),b=$("#mic");r.lang="en-US";b.classList.add("rec");toast("Listening...");
  r.onresult=ev=>{$("#q").value=ev.results[0][0].transcript;$("#sf").requestSubmit()};
  r.onend=()=>b.classList.remove("rec");r.onerror=()=>{b.classList.remove("rec");toast("Couldn't hear anything. Try again.")};
  try{r.start()}catch(e){b.classList.remove("rec")}
});
addEventListener("scroll",closePop,{passive:true});
const hv=location.hash.match(/^#v(\d+)$/);
chips();subList();render();if(hv&&V[+hv[1]])watch(+hv[1]);
</script>
</body>
</html>
